name: Test & build

on:
  push:
    branches:
      - "*"

jobs:
  test-and-build:
    name: Test & build
    # runs-on: ubuntu-24.04-arm
    runs-on: ubuntu-24.04
    permissions:
      contents: read # This is required for actions/checkout
      id-token: write # This is required for requesting the JWT
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Compile project
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: pnpm build

      - name: Configure AWS Credentials
        if: ${{ github.repository == 'swan-io/card-design-studio' && contains('refs/heads/main', github.ref) || contains(github.event.head_commit.message, '[dockerize]')}}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: eu-west-1

      - name: Login to Docker Registry
        if: ${{ github.repository == 'swan-io/card-design-studio' && contains('refs/heads/main', github.ref) || contains(github.event.head_commit.message, '[dockerize]') }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}

      - name: Set up Docker Buildx
        if: ${{ github.repository == 'swan-io/card-design-studio' && contains('refs/heads/main', github.ref) || contains(github.event.head_commit.message, '[dockerize]') }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Dockerize & Push to Registry
        if: ${{ github.repository == 'swan-io/card-design-studio' && contains('refs/heads/main', github.ref) || contains(github.event.head_commit.message, '[dockerize]') }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile-swan
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/card-design-studio:master-${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/card-design-studio:master-${{ github.ref_name }}

      - name: Deploy
        if: ${{ github.repository == 'swan-io/card-design-studio' && contains('refs/heads/main', github.ref) }}
        run: pnpm deploy-ci
        env:
          TAG: master-${{ github.sha }}
          DEPLOY_SWAN_APP_ID: ${{ secrets.DEPLOY_SWAN_APP_ID }}
          DEPLOY_SWAN_APP_SECRET: ${{ secrets.DEPLOY_SWAN_APP_SECRET }}
          DEPLOY_ENVIRONMENT: master
          DEPLOY_APP_NAME: card-design-studio
